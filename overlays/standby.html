    elbow(x0, yB, colW, botH, 8.5 * u + colW - gap, yB - (L.blocks.length ? L.blocks[L.blocks.length - 1].y + L.blocks[L.blocks.length - 1].h + gap : lowerTop + 6.5 * u), 3.6 * u, 1.2 * u, C.parchment, false)
    const sdW = textWidth(C.stardate, botH * 1.15) + 2 * gap
    rect(x0 + colW + 9 * u, yB - botH, Math.max(0, xR - 3.2 * u - sdW - (x0 + colW + 9 * u) - gap), botH, C.tan)
    text(C.stardate, xR - 3.2 * u - gap, yB - botH * -0.05, botH * 1.15, C.parchment, 'r')
    pill(xR - 3.2 * u + gap, yB - botH, 3.2 * u - gap, botH, C.parchment, 'right')
    // Working area: heading, then number columns and bars.
    text(C.heading, L.ax, L.ay + 1.9 * u, 1.9 * u, C.parchment)
    pill(L.ax + textWidth(C.heading, 1.9 * u) + 1.2 * u, L.ay + 0.55 * u, Math.max(0, L.barX - L.ax - textWidth(C.heading, 1.9 * u) - 2.4 * u), 1.0 * u, C.azure, 'both')
    const gy = L.ay + 4.2 * u
    const colStep = (L.barX - L.ax - 1.5 * u) / L.numCols
    for (const cell of L.cells) {
      const x = L.ax + cell.c * colStep
      const y = gy + cell.r * L.rowH + 1.05 * u
      const tintC = L.colTints[cell.c % L.colTints.length]
      if (cell.lit) {
        pill(x - 0.4 * u, y - 1.2 * u, Math.min(colStep - 0.6 * u, textWidth(cell.v, 1.0 * u) + 1.4 * u), 1.5 * u, tintC)
        text(cell.v, x + 0.3 * u, y, 1.0 * u, '#000')
      } else text(cell.v, x, y, 1.0 * u, tintC)
    }
    L.bars.forEach((b, i) => {
      const y = gy + i * 1.9 * u
      if (y + 1.3 * u > L.ay + L.ah) return
      text(b.label, L.barX + 2.4 * u, y + 1.05 * u, 1.0 * u, C.parchment, 'r')
      pill(L.barX + 3.0 * u, y, Math.max(1.3 * u, (L.barW - 3.0 * u) * b.v), 1.3 * u, b.colour, 'right')
    })
  }

  function tick(dt) {
    // About 6 number changes a second per 100 cells, and a bar or two stepping.
    const n = Math.max(1, Math.round(L.cells.length * 0.06 * dt * 10))
    for (let i = 0; i < n; i++) {
      const cell = L.cells[(Math.random() * L.cells.length) | 0]
      cell.v = lcarsNumber()
      if (Math.random() < 0.15) cell.lit = !cell.lit && Math.random() < 0.4
    }
    for (const b of L.bars) {
      if (Math.random() < 0.08 * dt * 10) b.to = 0.15 + Math.random() * 0.85
      b.v += (b.to - b.v) * Math.min(1, dt * 6)
    }
  }

  loadImage(ATLAS.src).then(img => {
    ATLAS.img = img
    layout()
    window.addEventListener('resize', () => { layout(); draw(0) })
    draw(0)
    canvas.classList.add('on')
    const shownAt = performance.now()
    let raf = 0, stopped = false, last = shownAt, acc = 0
    const stop = () => { stopped = true; cancelAnimationFrame(raf) }
    const dismiss = () => {
      if (stopped) return
      stop()
      try { parent.postMessage({ type: 'theme:visibility', visible: false }, '*') } catch {}
    }
    // A browser can fire a synthetic mousemove when the frame appears under a
    // still pointer, so movement counts only after 1.5 s and beyond 8 px.
    let origin = null
    window.addEventListener('pointermove', e => {
      if (performance.now() - shownAt < 1500) return
      if (!origin) { origin = [e.clientX, e.clientY]; return }
      if (Math.hypot(e.clientX - origin[0], e.clientY - origin[1]) > 8) dismiss()
    })
    window.addEventListener('pointerdown', e => { e.preventDefault(); dismiss() })
    window.addEventListener('wheel', dismiss, { passive: true })
    window.addEventListener('keydown', dismiss)
    if (reduced) return
    const STEP = 0.1, SLEEP_AT = 30 * 60
    function frame(ts) {
      if (stopped) return
      acc += Math.min(0.5, (ts - last) / 1000)
      last = ts
      if (acc >= STEP) {
        tick(acc)
        acc = 0
        draw((ts - shownAt) / 1000)
        if ((ts - shownAt) / 1000 > SLEEP_AT && canvas.classList.contains('on')) {
          canvas.style.transition = 'opacity 3s linear'
          canvas.classList.remove('on')
          setTimeout(stop, 3200)
        }
      }
      raf = requestAnimationFrame(frame)
    }
    raf = requestAnimationFrame(frame)
  })
})()
</script>
</body>
</html>
